apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Omar-Sa03/internal-developer-platform.git
    path: helm/fastapi-service
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
